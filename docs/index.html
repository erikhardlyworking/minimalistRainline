<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rainline</title><style>body{margin:0;background:#080808;color:#eee;font:17px/1.65 system-ui,sans-serif}main{max-width:1080px;margin:auto;padding:32px 24px}h1,h2{font-weight:400;line-height:1.2}h1{font-size:44px}h2{margin-top:48px}a{color:inherit;text-underline-offset:4px}nav{display:flex;flex-wrap:wrap;gap:22px;margin:24px 0}section{border-top:1px solid #555;margin:40px 0;padding-bottom:24px}pre{white-space:pre-wrap;font:inherit}.screens{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.screens img{width:100%;height:auto;border:1px solid #333}figure{margin:0}figcaption{font-size:13px;line-height:1.4;margin:8px 0}.feature{display:block;width:100%;max-width:700px;height:auto;border:1px solid #333;margin:20px 0}summary{cursor:pointer;padding:12px 0}small{color:#bbb}p{max-width:850px}code{overflow-wrap:anywhere}@media(max-width:750px){.screens{grid-template-columns:repeat(2,minmax(0,1fr))}h1{font-size:34px}}</style><main><h1>Rainline</h1><p>A minimal, open-source rain forecast widget for Android.</p><nav><a href="privacy/">Privacy policy · Personvern · Integritet · Tietosuoja · Privatliv</a><a href="https://github.com/erikhardlyworking/minimalistRainline">Source code</a><a href="mailto:workinghardlyforyou@gmail.com">Support</a></nav></main></html>
